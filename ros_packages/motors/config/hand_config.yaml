# Hand Configuration for PIB Hand Control
# Defines motor axes and grip positions

axes:
  daumen:
    motor_name: "thumb_right_stretch"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000  # Deutlich schneller (vorher 800)
    max_current: 1500
    
  zeigefinger:
    motor_name: "index_right_stretch"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000
    max_current: 1500
    
  mittelfinger:
    motor_name: "middle_right_stretch"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000
    max_current: 1500
    
  ringfinger:
    motor_name: "ring_right_stretch"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000
    max_current: 1500
    
  kleinfinger:
    motor_name: "pinky_right_stretch"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000
    max_current: 1500
    
  daumen_rotieren:
    motor_name: "thumb_right_opposition"
    min_pos: 0
    max_pos: 9000
    max_speed: 2000
    max_current: 1500
    
  handgelenk:
    motor_name: "wrist_right"
    min_pos: 0
    max_pos: 9000
    max_speed: 1500
    max_current: 1200

# Grip definitions - positions in Tinkerforge units (0 bis 9000)
# 0 = offen, positive Werte = geschlossen
grips:
  OPEN:
    daumen: 0
    zeigefinger: 0
    mittelfinger: 0
    ringfinger: 0
    kleinfinger: 0
    daumen_rotieren: 0
    handgelenk: 0
    
  CYLINDER:
    daumen: 4500
    zeigefinger: 4500
    mittelfinger: 4500
    ringfinger: 4500
    kleinfinger: 4500
    daumen_rotieren: 4500
    handgelenk: 4500
    
  DROP:
    daumen: 0
    zeigefinger: 0
    mittelfinger: 0
    ringfinger: 0
    kleinfinger: 0
    daumen_rotieren: 0
    handgelenk: 0